[package]
name = "daggerbot-rs"
version = "4.2.4"
edition = "2024"

[workspace]
members = ["grpc"]

[workspace.dependencies]
asahi = { git = "https://git.playground.red/nwerosama/asahi", branch = "master", features = ["canvas", "coordinator", "prober", "sqlx-pg"] }
bb8 = "0.9.0"
bb8-redis = "0.24.0"
cargo_toml = "0.22.3"
dashmap = "6.1.0"
farmsim = { git = "https://github.com/nwerosama/farmsim-rs", branch = "master", features = ["fs25"] }
lazy_static = "1.5.0"
mlua = { version = "0.11.3", features = ["lua54", "send", "vendored"] }
num-format = "0.4.4"
poise = { git = "https://git.playground.red/nwerosama/poise", branch = "lock-serenity-commit" }
prost = "0.14.1"
rand = "0.9.2"
regex = "1.11.2"
reqwest = { version = "0.12.23", features = ["json", "native-tls-vendored"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
similar = "2.7.0"
smallvec = "1.15.1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono"] }
tokenservice-client = { version = "0.4.5", registry = "local" }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "0.9.5"
tonic = "0.14.2"
tonic-prost = "0.14.2"

[dependencies]
asahi = { workspace = true }
bb8 = { workspace = true }
bb8-redis = { workspace = true }
cargo_toml = { workspace = true }
dag_grpc = { path = "grpc" }
dashmap = { workspace = true }
farmsim = { workspace = true }
lazy_static = { workspace = true }
mlua = { workspace = true }
num-format = { workspace = true }
poise = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
smallvec = { workspace = true }
sqlx = { workspace = true }
tokenservice-client = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[[bin]]
name = "daggerbot"
path = "src/main.rs"

[lib]
name = "daggerbot"
path = "src/lib.rs"

[patch.crates-io]

[features]
production = ["automod"]
automod = []
not_ready = []

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 2
