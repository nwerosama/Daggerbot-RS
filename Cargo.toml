[package]
name = "daggerbot-rs"
version = "4.2.0"
edition = "2024"

[workspace]
members = ["grpc", "kube"]

[workspace.dependencies]
asahi = { version = "0.1.5", features = ["canvas", "coordinator"] }
bb8 = "0.9.0"
bb8-redis = "0.24.0"
cargo_toml = "0.22.1"
dashmap = "6.1.0"
farmsim = { version = "0.1.1", features = ["fs25"] }
lazy_static = "1.5.0"
mlua = { version = "0.10.5", features = ["lua54", "send", "vendored"] }
num-format = "0.4.4"
poise = "0.6.1"
prost = "0.13.5" # update to 0.14 when tonic releases new version
rand = "0.9.1"
regex = "1.11.1"
reqwest = { version = "0.12.22", features = ["json", "native-tls-vendored"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
similar = "2.7.0"
smallvec = "1.15.1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono"] }
sysinfo = "0.35.2"
tokenservice-client = { version = "0.4.5", registry = "local" }
tokio = { version = "1.46.0", features = ["rt-multi-thread", "macros", "signal"] }
toml = "0.8.23"
tonic = "0.13.1"
uptime_lib = "0.3.1"

[dependencies]
asahi = { workspace = true }
bb8 = { workspace = true }
bb8-redis = { workspace = true }
cargo_toml = { workspace = true }
dag_grpc = { path = "grpc" }
dag_kube = { path = "kube" }
dashmap = { workspace = true }
farmsim = { workspace = true }
lazy_static = { workspace = true }
mlua = { workspace = true }
num-format = { workspace = true }
poise = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
smallvec = { workspace = true }
sqlx = { workspace = true }
sysinfo = { workspace = true }
tokenservice-client = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
uptime_lib = { workspace = true }

[patch.crates-io]
# poise = { git = "https://github.com/serenity-rs/poise", branch = "serenity-next" }
poise = { git = "http://localhost:65100/nwerosama/poise", branch = "cv2" }
asahi = { git = "https://github.com/Niko-Devel/asahi", branch = "master" }
farmsim = { git = "https://github.com/nwerosama/farmsim-rs", branch = "master" }

[features]
production = ["automod"]
automod = []
not_ready = []

[[bin]]
name = "daggerbot"
path = "src/main.rs"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 2
