name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly-2025-07-29

jobs:
  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
          token: '${{ secrets.NWERO_PAT }}'

      - name: APT Cache
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libprotobuf-dev libprotobuf32t64 libprotoc32t64 protobuf-compiler
          version: 1.0

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ runner.os }}-cache-v1
          cache-on-failure: 'true'
          cache-all-crates: 'true'

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-features

  build:
    runs-on: ubuntu-latest
    needs: clippy

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
          token: '${{ secrets.NWERO_PAT }}'

      - name: APT Cache
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libprotobuf-dev libprotobuf32t64 libprotoc32t64 protobuf-compiler
          version: 1.0

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ runner.os }}-cache-v1
          cache-on-failure: 'true'
          cache-all-crates: 'true'

      - name: Log into Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile
        run: |
          cargo build --locked -rF production
          ls -la target

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/nwerosama/daggerbot-rs:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/koi'

    steps:
      - name: Create deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '{
            "ref": "${{ github.sha }}",
            "environment": "production",
            "auto_merge": false,
            "required_contexts": ["build"],
            "payload": {
              "deployment_name": "daggerbot",
              "container_name": "daggerbot-app",
              "image": "ghcr.io/nwerosama/daggerbot-rs:koi"
            }
          }' | gh api repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/deployments --method POST --input -
